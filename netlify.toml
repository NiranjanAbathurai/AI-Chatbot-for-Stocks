[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Note: API routing is handled by Netlify Functions v2 path config
# (export const config = { path: "/api/..." }) in each function file.
# Functions v2 path config takes priority over redirect rules.

# SPA fallback — serve index.html for unmatched routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
